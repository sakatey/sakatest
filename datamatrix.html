<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Matrix 印刷（A4/A3）</title>

<!-- BWIP-JS (Data Matrix ECC200対応) -->
<!-- CDN: https://github.com/metafloor/bwip-js -->
<script src="https://unpkg.com/bwip-js/dist/bwip-js-min.js"></script>

<style>
  :root {
    --paper-width: 210mm;   /* 既定 A4 縦 */
    --paper-height: 297mm;
    --margin: 0mm;          /* 印刷余白ゼロ */
    --bg: #fff;
  }
  @page {
    size: var(--paper-width) var(--paper-height);
    margin: var(--margin);
  }
  @media print {
    html, body { background: var(--bg); }
    #controls { display: none !important; }
    .page {
      width: var(--paper-width);
      height: var(--paper-height);
      margin: 0;
      page-break-after: always;
    }
  }
  body {
    margin: 0;
    background: #f6f7f9;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: #222;
  }
  #controls {
    position: sticky; top: 0; z-index: 3;
    background: #fff; border-bottom: 1px solid #e5e5e5;
    padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  #controls label { font-size: 14px; }
  #controls input[type="text"] { width: 36rem; max-width: 95vw; }
  .page {
    width: var(--paper-width); height: var(--paper-height);
    margin: 12px auto; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.08);
    display: grid; place-items: center; position: relative;
  }
  .canvas-wrap {
    display: grid; place-items: center; 
    max-width: calc(var(--paper-width) - 20mm);
    max-height: calc(var(--paper-height) - 20mm);
  }
  canvas { background: #fff; }
  .note {
    position: absolute; bottom: 8mm; left: 8mm; right: 8mm;
    font-size: 11px; color: #666; text-align: left;
    line-height: 1.5;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input, button {
    font-size: 14px; padding: 6px 8px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  button.ghost { background: #fff; color: #2563eb; border-color: #2563eb; }
  .status { font-size: 13px; color: #555; }
  .warn { color: #a12828; font-weight: 600; }
</style>
</head>
<body>

<div id="controls">
  <div class="row">
    <label>モード:
      <select id="mode">
        <option value="fetch">fetch（最新をAPIから取得）</option>
        <option value="direct">direct（下のテキストをそのまま）</option>
      </select>
    </label>

    <label>サイズ:
      <select id="paper">
        <option value="A4">A4</option>
        <option value="A3">A3</option>
      </select>
    </label>

    <label>向き:
      <select id="orient">
        <option value="portrait">縦</option>
        <option value="landscape">横</option>
      </select>
    </label>

    <label>scale（セルpx）:
      <input id="scale" type="number" min="2" max="32" value="8" />
    </label>

    <button id="render" class="primary">再生成</button>
    <button id="print" class="ghost">印刷</button>
  </div>

  <div class="row" style="flex:1 1 100%;">
    <label style="flex:1 1 auto;">テキスト（directモード時）:
