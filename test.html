
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AWS Message Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --main-font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, -apple-system, sans-serif;
    --color-text: #222;
    --color-muted: #666;
    --color-accent: #1976d2;
    --color-border: #e5e7eb;
    --color-row-alt: #fafafa;
    --color-highlight: #fff2a8;
    --color-error: #d32f2f;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--main-font);
    color: var(--color-text);
    margin: 0;
    padding: 24px;
    background: #fff;
    line-height: 1.6;
  }

  h2 {
    font-size: 28px;
    margin: 0 0 16px;
    font-weight: 700;
  }
  .subtitle {
    margin: 0 0 24px;
    color: var(--color-muted);
    font-size: 14px;
  }
