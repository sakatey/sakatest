
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AWS Message Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --main-font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, -apple-system, sans-serif;
    --color-text: #222;
    --color-muted: #666;
    --color-accent: #1976d2;
    --color-border: #e5e7eb;
    --color-row-alt: #fafafa;
    --color-highlight: #fff2a8;
    --color-error: #d32f2f;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--main-font);
    color: var(--color-text);
    margin: 0;
    padding: 24px;
    background: #fff;
    line-height: 1.6;
  }

  h2 {
    font-size: 28px;
    margin: 0 0 16px;
    font-weight: 700;
  }
  .subtitle {
    margin: 0 0 24px;
    color: var(--color-muted);
    font-size: 14px;
  }

  .section {
    margin: 20px 0 36px;
  }

  /* カード風枠 */
  .main-card {
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #fff;
  }
  .main-title {
    font-size: 20px;
    margin: 0 0 10px;
    color: var(--color-accent);
  }

  .table-wrap {
    overflow: auto;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    background: #fff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #f7f7f7;
    z-index: 1;
  }
  th, td {
    border-bottom: 1px solid var(--color-border);
    padding: 12px 14px;
    text-align: left;
    white-space: nowrap; /* デフォルトは横スクロール想定 */
  }
  tbody tr:nth-child(even) td {
    background: var(--color-row-alt);
  }

  /* フォントサイズ：メインを大きく、履歴はやや大きめ */
  .table-main {
    font-size: 22px; /* 大きめ（PC/タブレット向け） */
    min-width: 880px; /* PCでは横広でも見やすく */
  }
  .table-history {
    font-size: 18px; /* やや小さめ */
    width: 100%;
    min-width: 0; /* 履歴は画面幅内に収める */
  }

  /* 検索UI */
  .searchbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 12px 0 10px;
    flex-wrap: wrap;
  }
  .searchbar input[type="text"] {
    flex: 1 1 280px;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    outline: none;
  }
  .searchbar button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: var(--color-accent);
    cursor: pointer;
  }
  .searchbar button:active { transform: translateY(1px); }
  .search-help {
    font-size: 12px;
    color: var(--color-muted);
  }

  /* ハイライト演出 */
  .highlight {
    animation: highlightFlash 2s ease;
    background: var(--color-highlight) !important;
  }
  @keyframes highlightFlash {
    0% { background: var(--color-highlight); }
    100% { background: var(--color-row-alt); }
  }

  /* モーダル */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center; justify-content: center;
    z-index: 9999;
  }
  .modal {
    background: #fff;
    border-radius: 12px;
    padding: 18px;
    max-width: 360px;
    width: calc(100% - 40px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }
  .modal h4 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .modal p {
    margin: 0 0 14px;
    color: var(--color-muted);
  }
  .modal button {
    display: inline-block;
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    color: #fff;
    background: var(--color-accent);
    cursor: pointer;
  }

  /* エラー表示 */
  .error {
    color: var(--color-error);
    font-weight: 600;
  }

  /* ===== スマホ最適化 ===== */

  /* 最新：スマホでは3段カード、PC/タブレットでは表 */
  .latest-card {
    display: none; /* デフォルト：非表示（PC/タブレット） */
    border: 1px dashed var(--color-border);
    border-radius: 10px;
    padding: 12px;
    background: #fcfcfc;
    font-size: 18px;
  }
  .latest-card .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-bottom: 8px;
  }
  .latest-card .label {
    color: var(--color-muted);
    font-size: 12px;
    margin-right: 6px;
  }
  .latest-card .pair {
    display: inline-flex;
    gap: 6px;
  }

  /* 履歴：スマホでは1レコード=1行、横スクロール無し（セル内で折り返し） */
  @media (max-width: 700px) {
    .table-main { display: none; }       /* 最新の表は隠す */
    .latest-card { display: block; }      /* 代わりにカード表示 */
    .table-history { font-size: 13px; }   /* 履歴はさらに小さく */
    .table-history th, .table-history td {
      padding: 8px 6px;
      white-space: normal;                /* 折り返し許可 */
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .table-wrap { overflow-x: hidden; }   /* 横スクロール隠す */
    thead th { position: sticky; top: 0; }
  }
</style>
</head>
<body>

  <h2>ヒラオキ ⇔ ミエテル</h2>
  <div class="subtitle">AWS APIから取得したCSVを表で表示（最新はスマホで3段表示／履歴は1行表示＋検索）</div>

  <!-- 最新データ（メイン表示） -->
  <div class="section main-card">
    <h3 class="main-title">最新のデータ</h3>

    <!-- スマホ用：3段カード -->
    <div id="latest-card" class="latest-card" aria-label="最新データ（カード）">
      <!-- JSで中身を差し込みます -->
    </div>

    <!-- PC/タブレット用：表 -->
    <div class="table-wrap">
      <table class="table-main" aria-label="最新データ（表）">
        <thead>
          <tr>
            <!-- 列順を修正：エリア名-座標, 2Dコード, 名前, 指示日, カメラ名 -->
            <th>エリア名-座標</th>
            <th>2Dコード</th>
            <th>名前</th>
            <th>指示日</th>
            <th>カメラ名</th>
          </tr>
        </thead>
        <tbody id="main-tbody">
          <tr><td colspan="5" id="main-loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 履歴（検索付き） -->
  <div class="section">
    <h3>履歴（最大100件）</h3>
    <div class="searchbar">
      <input id="search-input" type="text" placeholder="2Dコード または 名前 を入力" />
      <button id="search-btn">検索</button>
      <div class="search-help">※ 履歴表から <strong>2Dコード（2列目）</strong> と <strong>名前（3列目）</strong> を対象に部分一致検索します。</div>
    </div>
    <div class="table-wrap">
      <table class="table-history" aria-label="履歴データ">
        <thead>
          <tr>
            <th>#</th>
            <th>エリア名-座標</th>
            <th>2Dコード</th>
            <th>名前</th>
            <th>指示日</th>
            <th>カメラ名</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="6" id="history-loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Not Found モーダル -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h4 id="modal-title">Not Found</h4>
      <p id="modal-message">該当するデータが見つかりませんでした。</p>
      <button id="modal-ok">OK</button>
    </div>
  </div>

<script>
  // ======== 設定 ========
  const API_URL = "https://5kptpm020d.execute-api.ap-northeast-1.amazonaws.com/message";
  const LOCAL_STORAGE_KEY = "awsCsvHistoryLines"; // ブラウザ保存用

  // ======== ユーティリティ ========

  /** 行（CSV1行）を、ダブルクオート対応で確実に分割して配列にします */
  function parseCsvLine(line) {
    const result = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];

      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          // 連続する"" はエスケープされたダブルクオート
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = "";
      } else {
        cur += ch;
      }
    }
    result.push(cur.trim());
    return result;
  }

  /** APIの応答を、CSV行（文字列配列）に正規化 */
  function normalizeToLines(data) {
    let lines = [];

    if (Array.isArray(data)) {
      lines = data.filter(Boolean);
    } else if (data && typeof data === "object") {
      if (typeof data.text === "string") {
        lines = data.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      } else if (Array.isArray(data.items)) {
        lines = data.items.filter(Boolean);
      } else if (Array.isArray(data.records)) {
        lines = data.records.filter(Boolean);
      } else if (Array.isArray(data.messages)) {
        lines = data.messages.filter(Boolean);
      }
    } else if (typeof data === "string") {
      lines = data.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }

    return lines;
  }

  /** 5列に整形（不足は空文字で補完、過剰は末尾を結合） */
  function ensureFiveColumns(cols) {
    if (cols.length < 5) {
      return [...cols, ...Array(5 - cols.length).fill("")];
    }
    if (cols.length > 5) {
      // 6列目以降は最後の列に結合しておく
      const mergedTail = cols.slice(4).join(" ");
      return [cols[0], cols[1], cols[2], cols[3], mergedTail];
    }
    return cols;
  }

  /** 行配列（CSV文字列配列）→ レコード配列
   *  列順前提： [0]=エリア名-座標, [1]=2Dコード, [2]=名前, [3]=指示日, [4]=カメラ名
   */
  function toRecords(lines) {
    return lines.map(l => ensureFiveColumns(parseCsvLine(l)));
  }

  /** localStorage に最大100件で保存 */
  function saveHistoryLines(lines) {
    const max = 100;
    const trimmed = lines.slice(0, max);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(trimmed));
  }

  /** localStorage から取得 */
  function loadHistoryLines() {
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch {
      return [];
    }
  }

  /** ハイライト適用 */
  function applyHighlight(rowEl) {
    document.querySelectorAll(".highlight").forEach(el => el.classList.remove("highlight"));
    rowEl.classList.add("highlight");
    setTimeout(() => rowEl.classList.remove("highlight"), 3000);
  }

  /** モーダル表示/非表示 */
  function showModal(message = "該当するデータが見つかりませんでした。") {
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-backdrop").style.display = "flex";
  }
  function hideModal() {
    document.getElementById("modal-backdrop").style.display = "none";
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  // ======== 描画 ========

  function renderMain(latestRecord) {
    // 表（PC/タブレット）
    const tbody = document.getElementById("main-tbody");
    tbody.innerHTML = "";
    if (!latestRecord) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5" class="error">データがありません</td>`;
      tbody.appendChild(tr);
    } else {
      const tr = document.createElement("tr");
      // 列順：エリア名-座標, 2Dコード, 名前, 指示日, カメラ名
      tr.innerHTML = `
        <td>${escapeHtml(latestRecord[0])}</td>
        <td>${escapeHtml(latestRecord[1])}</td>
        <td>${escapeHtml(latestRecord[2])}</td>
        <td>${escapeHtml(latestRecord[3])}</td>
        <td>${escapeHtml(latestRecord[4])}</td>
      `;
      tbody.appendChild(tr);
    }

    // カード（スマホ）
    const card = document.getElementById("latest-card");
    card.innerHTML = "";
    if (!latestRecord) {
      card.innerHTML = `<div class="error">データがありません</div>`;
      return;
    }
    // 3段表示：
    // 1段目：カメラ名, エリア名-座標
    // 2段目：名前, 2Dコード
    // 3段目：指示日
    const row1 = document.createElement("div");
    row1.className = "row";
    row1.innerHTML = `
      <span class="pair"><span class="label">カメラ名</span><strong>${escapeHtml(latestRecord[4])}</strong></span>
      <span class="pair"><span class="label">エリア名-座標</span><strong>${escapeHtml(latestRecord[0])}</strong></span>
    `;

    const row2 = document.createElement("div");
    row2.className = "row";
    row2.innerHTML = `
      <span class="pair"><span class="label">名前</span><strong>${escapeHtml(latestRecord[2])}</strong></span>
      <span class="pair"><span class="label">2Dコード</span><strong>${escapeHtml(latestRecord[1])}</strong></span>
    `;

    const row3 = document.createElement("div");
    row3.className = "row";
    row3.innerHTML = `
      <span class="pair"><span class="label">指示日</span><strong>${escapeHtml(latestRecord[3])}</strong></span>
    `;

    card.appendChild(row1);
    card.appendChild(row2);
    card.appendChild(row3);
  }

  function renderHistory(records, { skipFirst = true } = {}) {
    const tbody = document.getElementById("history-tbody");
    tbody.innerHTML = "";

    let startIndex = 0;
    if (skipFirst && records.length > 0) {
      startIndex = 1; // 最新はメインに表示したので履歴からは除外
    }

    if (records.length <= startIndex) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="6">履歴はありません</td>`;
      tbody.appendChild(tr);
      return;
    }

    for (let i = startIndex; i < Math.min(records.length, 100); i++) {
      const rec = records[i];
      const tr = document.createElement("tr");
      tr.setAttribute("data-idx", String(i)); // 検索で参照
      // 列順：#, エリア名-座標, 2Dコード, 名前, 指示日, カメラ名
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${escapeHtml(rec[0])}</td>
        <td>${escapeHtml(rec[1])}</td>
        <td>${escapeHtml(rec[2])}</td>
        <td>${escapeHtml(rec[3])}</td>
        <td>${escapeHtml(rec[4])}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  // ======== 検索 ========

  function setupSearch(records) {
    const input = document.getElementById("search-input");
    const btn = document.getElementById("search-btn");

    function doSearch() {
      const term = (input.value || "").trim();
      if (!term) return;

      // 対象：records[1..] の 2Dコード([1]) と 名前([2])
      let foundIndex = -1;
      for (let i = 1; i < Math.min(records.length, 100); i++) {
        const rec = records[i];
        const code2d = String(rec[1] ?? "");
        const name = String(rec[2] ?? "");
        if (code2d.includes(term) || name.includes(term)) {
          foundIndex = i;
          break;
        }
      }

      if (foundIndex >= 0) {
        const row = document.querySelector(`tr[data-idx="${foundIndex}"]`);
        if (row) {
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          applyHighlight(row);
        }
      } else {
        showModal("該当するデータが見つかりませんでした。");
      }
    }

    btn.addEventListener("click", doSearch);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });
  }

  // ======== メイン処理 ========

  async function init() {
    const mainLoading = document.getElementById("main-loading");
    const historyLoading = document.getElementById("history-loading");
    let fetchedLines = [];
    let useLines = [];

    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      fetchedLines = normalizeToLines(data);

      if (fetchedLines.length === 0) {
        useLines = loadHistoryLines();
      } else if (fetchedLines.length === 1) {
        const current = fetchedLines[0];
        const stored = loadHistoryLines();
        if (stored[0] !== current) {
          const deduped = [current, ...stored.filter(l => l !== current)];
          useLines = deduped.slice(0, 100);
        } else {
          useLines = stored.length ? stored : [current];
        }
        saveHistoryLines(useLines);
      } else {
        useLines = fetchedLines.slice(0, 100);
        saveHistoryLines(useLines);
      }
    } catch (err) {
      console.error(err);
      useLines = loadHistoryLines();
      if (!useLines.length) {
        if (mainLoading) mainLoading.outerHTML = `<td colspan="5" class="error">エラー：${escapeHtml(String(err))}</td>`;
        if (historyLoading) historyLoading.outerHTML = `<td colspan="6">履歴はありません</td>`;
        return;
      }
    }

    const records = toRecords(useLines);

    // 最新
    if (mainLoading) mainLoading.parentElement?.remove();
    renderMain(records[0]);

    // 履歴（最新はメインに表示したのでスキップ）
    if (historyLoading) historyLoading.parentElement?.remove();
    renderHistory(records, { skipFirst: true });

    // 検索セットアップ
    setupSearch(records);
  }

  // モーダルOK
  document.getElementById("modal-ok").addEventListener("click", hideModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") hideModal();
  });

  // 起動
  init();
</script>
</body>
</html>
