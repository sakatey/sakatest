
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AWS Message Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --main-font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", system-ui, -apple-system, sans-serif;
    --color-text: #222;
    --color-muted: #666;
    --color-accent: #1976d2;
    --color-border: #e5e7eb;
    --color-row-alt: #fafafa;
    --color-highlight: #fff2a8;
    --color-error: #d32f2f;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--main-font);
    color: var(--color-text);
    margin: 0;
    padding: 24px;
    background: #fff;
    line-height: 1.6;
  }

  h2 { font-size: 28px; margin: 0 0 16px; font-weight: 700; }
  .subtitle { margin: 0 0 24px; color: var(--color-muted); font-size: 14px; }

  .section { margin: 20px 0 36px; }

  /* カード風枠 */
  .main-card {
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    background: #fff;
  }
  .main-title { font-size: 20px; margin: 0 0 10px; color: var(--color-accent); }

  .table-wrap {
    overflow: auto;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    background: #fff;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: #f7f7f7; z-index: 1; }
  th, td {
    border-bottom: 1px solid var(--color-border);
    padding: 12px 14px;
    text-align: left;
    white-space: nowrap; /* PCは横スクロール想定 */
  }
  tbody tr:nth-child(even) td { background: var(--color-row-alt); }

  .table-main { font-size: 22px; min-width: 880px; }
  .table-history { font-size: 18px; width: 100%; min-width: 0; }

  /* 検索UI */
  .searchbar {
    display: flex; gap: 10px; align-items: center;
    margin: 12px 0 10px; flex-wrap: wrap;
  }
  .searchbar input[type="text"] {
    flex: 1 1 220px; padding: 10px 12px; font-size: 16px;
    border: 1px solid var(--color-border); border-radius: 8px; outline: none;
  }
  .searchbar button {
    padding: 10px 14px; font-size: 14px; border: none; border-radius: 8px;
    color: #fff; background: var(--color-accent); cursor: pointer;
  }
  .searchbar button:active { transform: translateY(1px); }
  #clear-btn { background: #9e9e9e; }
  .search-help { font-size: 12px; color: var(--color-muted); }

  /* ハイライト（セルに適用して確実に上書き） */
  tbody tr.highlight td {
    background: var(--color-highlight) !important;
    transition: background 0.6s ease;
  }

  /* モーダル */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 9999;
  }
  .modal {
    background: #fff; border-radius: 12px; padding: 18px;
    max-width: 360px; width: calc(100% - 40px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }
  .modal h4 { margin: 0 0 8px; font-size: 18px; }
  .modal p  { margin: 0 0 14px; color: var(--color-muted); }
  .modal button {
    display: inline-block; padding: 10px 16px; font-size: 14px;
    border: none; border-radius: 8px; color: #fff; background: var(--color-accent); cursor: pointer;
  }

  .error { color: var(--color-error); font-weight: 600; }

  /* ===== スマホ最適化 ===== */
  .latest-card {
    display: none; border: 1px dashed var(--color-border);
    border-radius: 10px; padding: 12px; background: #fcfcfc; font-size: 18px;
  }
  .latest-card .row { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 8px; }
  .latest-card .label { color: var(--color-muted); font-size: 12px; margin-right: 6px; }
  .latest-card .pair { display: inline-flex; gap: 6px; }

  @media (max-width: 700px) {
    .table-main { display: none; }
    .latest-card { display: block; }
    .table-history { font-size: 13px; }
    .table-history th, .table-history td {
      padding: 8px 6px; white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    }
    .table-wrap { overflow-x: hidden; }
    thead th { position: sticky; top: 0; }
  }
</style>
</head>
<body>

  <h2>ヒラオキ ⇔ ミエテル</h2>
  <div class="subtitle">AWS APIから取得したCSVを表で表示（最新はスマホで3段表示／履歴は1行表示＋検索／最新も履歴に含める）</div>

  <!-- 最新データ -->
  <div class="section main-card">
    <h3 class="main-title">最新のデータ</h3>

    <!-- スマホ用：3段カード -->
    <div id="latest-card" class="latest-card" aria-label="最新データ（カード）"></div>

    <!-- PC/タブレット用：表 -->
    <div class="table-wrap">
      <table class="table-main" aria-label="最新データ（表）">
        <thead>
          <tr>
            <!-- 列順：エリア名-座標, 2Dコード, 名前, 指示日, カメラ名 -->
            <th>エリア名-座標</th>
            <th>2Dコード</th>
            <th>名前</th>
            <th>指示日</th>
            <th>カメラ名</th>
          </tr>
        </thead>
        <tbody id="main-tbody">
          <tr><td colspan="5" id="main-loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 履歴（検索＋クリア） -->
  <div class="section">
    <h3>履歴（最大100件）</h3>
    <div class="searchbar">
      <input id="search-input" type="text" placeholder="2Dコード または 名前 を入力" />
      <button id="search-btn">検索</button>
      <button id="clear-btn">履歴をクリア</button>
      <div class="search-help">※ 履歴表から <strong>2Dコード（2列目）</strong> と <strong>名前（3列目）</strong> を対象に部分一致検索します。</div>
    </div>
    <div class="table-wrap">
      <table class="table-history" aria-label="履歴データ">
        <thead>
          <tr>
            <th>#</th>
            <th>エリア名-座標</th>
            <th>2Dコード</th>
            <th>名前</th>
            <th>指示日</th>
            <th>カメラ名</th>
          </tr>
        </thead>
        <tbody id="history-tbody">
          <tr><td colspan="6" id="history-loading">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- モーダル -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <h4 id="modal-title">情報</h4>
      <p id="modal-message">メッセージ</p>
      <button id="modal-ok">OK</button>
    </div>
  </div>

<script>
  // ======== 設定 ========
  const API_URL = "https://5kptpm020d.execute-api.ap-northeast-1.amazonaws.com/message";
  const LOCAL_STORAGE_KEY = "awsCsvHistoryLines";

  // 画面全体で共有するレコード配列（配列の配列：[[c0..c4], ...]）
  let recordsGlobal = [];

  // ======== CSVユーティリティ ========

  /** CSV 1行を厳密に分割（ダブルクオート対応） */
  function parseCsvLine(line) {
    const s = String(line ?? "");
    const result = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === '"') {
        if (inQuotes && s[i + 1] === '"') { cur += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (ch === ',' && !inQuotes) {
        result.push(cur.trim()); cur = "";
      } else {
        cur += ch;
      }
    }
    result.push(cur.trim());
    return result;
  }

  /** 5列に整形（不足は空で補完／超過は5列目に結合） */
  function ensureFiveColumns(cols) {
    const arr = (cols || []).map(v => String(v ?? ""));
    if (arr.length < 5) return [...arr, ...Array(5 - arr.length).fill("")];
    if (arr.length > 5) return [arr[0], arr[1], arr[2], arr[3], arr.slice(4).join(" ")];
    return arr;
  }

  /** CSVフィールドのエスケープ */
  function csvEscape(field) {
    const s = String(field ?? "");
    if (/[",\n\r]/.test(s) || /^\s|\s$/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  /** レコード配列 → CSV 1行 */
  function toCsvLine(rec) {
    return ensureFiveColumns(rec).map(csvEscape).join(",");
  }

  /** APIやlocalStorageから得た行配列（文字列 or 配列）→ レコード配列 */
  function toRecords(lines) {
    return (lines || []).map(l => {
      if (Array.isArray(l)) return ensureFiveColumns(l);
      return ensureFiveColumns(parseCsvLine(String(l)));
    });
  }

  /** localStorage に「CSV文字列」として最大100件保存（配列が来てもCSV化） */
  function saveHistoryLines(linesOrRecs) {
    const max = 100;
    const out = (linesOrRecs || []).map(item => Array.isArray(item) ? toCsvLine(item) : String(item));
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(out.slice(0, max)));
  }

  /** localStorage から取得（配列が混入していてもCSV文字列に正規化して即時移行） */
  function loadHistoryLines() {
    try {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      const out = arr.map(item => Array.isArray(item) ? toCsvLine(item) : String(item));
      // 不正形があれば移行保存
      if (JSON.stringify(arr) !== JSON.stringify(out)) {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(out.slice(0, 100)));
      }
      return out;
    } catch { return []; }
  }

  // ======== 共通UIユーティリティ ========

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
  }

  function applyHighlight(rowEl) {
    document.querySelectorAll("tbody tr.highlight").forEach(el => el.classList.remove("highlight"));
    rowEl.classList.add("highlight");
    setTimeout(() => rowEl.classList.remove("highlight"), 2000);
  }

  function showModal(message = "メッセージ", title = "情報") {
    document.getElementById("modal-title").innerText = title;
    document.getElementById("modal-message").innerText = message;
    document.getElementById("modal-backdrop").style.display = "flex";
  }
  function hideModal() { document.getElementById("modal-backdrop").style.display = "none"; }

  // ======== 描画 ========

  function renderMain(latestRecord) {
    // 表（PC/タブレット）
    const tbody = document.getElementById("main-tbody");
    tbody.innerHTML = "";
    if (!latestRecord) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="5" class="error">データがありません</td>`;
      tbody.appendChild(tr);
    } else {
      const tr = document.createElement("tr");
      // 列順：エリア名-座標, 2Dコード, 名前, 指示日, カメラ名
      tr.innerHTML = `
        <td>${escapeHtml(latestRecord[0])}</td>
        <td>${escapeHtml(latestRecord[1])}</td>
        <td>${escapeHtml(latestRecord[2])}</td>
        <td>${escapeHtml(latestRecord[3])}</td>
        <td>${escapeHtml(latestRecord[4])}</td>
      `;
      tbody.appendChild(tr);
    }

    // スマホ用カード
    const card = document.getElementById("latest-card");
    card.innerHTML = "";
    if (!latestRecord) {
      card.innerHTML = `<div class="error">データがありません</div>`;
      return;
    }
    const row1 = document.createElement("div");
    row1.className = "row";
    row1.innerHTML = `
      <span class="pair"><span class="label">カメラ名</span><strong>${escapeHtml(latestRecord[4])}</strong></span>
      <span class="pair"><span class="label">エリア名-座標</span><strong>${escapeHtml(latestRecord[0])}</strong></span>
    `;
    const row2 = document.createElement("div");
    row2.className = "row";
    row2.innerHTML = `
      <span class="pair"><span class="label">名前</span><strong>${escapeHtml(latestRecord[2])}</strong></span>
      <span class="pair"><span class="label">2Dコード</span><strong>${escapeHtml(latestRecord[1])}</strong></span>
    `;
    const row3 = document.createElement("div");
    row3.className = "row";
    row3.innerHTML = `
      <span class="pair"><span class="label">指示日</span><strong>${escapeHtml(latestRecord[3])}</strong></span>
    `;
    card.appendChild(row1); card.appendChild(row2); card.appendChild(row3);
  }

  function renderHistory(records, { skipFirst = false } = {}) {
    const tbody = document.getElementById("history-tbody");
    tbody.innerHTML = "";

    let startIndex = 0;
    if (skipFirst && records.length > 0) startIndex = 1;

    if (records.length <= startIndex) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="6">履歴はありません</td>`;
      tbody.appendChild(tr);
      return;
    }

    for (let i = startIndex; i < Math.min(records.length, 100); i++) {
      const rec = records[i];
      const tr = document.createElement("tr");
      tr.setAttribute("data-idx", String(i)); // 元配列indexをそのまま
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${escapeHtml(rec[0])}</td>
        <td>${escapeHtml(rec[1])}</td>
        <td>${escapeHtml(rec[2])}</td>
        <td>${escapeHtml(rec[3])}</td>
        <td>${escapeHtml(rec[4])}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  // ======== 検索 ========

  function setupSearch(records) {
    const input = document.getElementById("search-input");
    const btn = document.getElementById("search-btn");

    function doSearch() {
      const term = (input.value || "").trim().toLowerCase();
      if (!term) return;

      let foundIndex = -1;
      for (let i = 0; i < Math.min(records.length, 100); i++) {
        const rec = records[i];
        const code2d = String(rec[1] ?? "").toLowerCase().trim();
        const name   = String(rec[2] ?? "").toLowerCase().trim();
        if (code2d.includes(term) || name.includes(term)) { foundIndex = i; break; }
      }

      if (foundIndex >= 0) {
        const row = document.querySelector(`tbody tr[data-idx="${foundIndex}"]`);
        if (row) { row.scrollIntoView({ behavior: "smooth", block: "center" }); applyHighlight(row); }
      } else {
        showModal("該当するデータが見つかりませんでした。", "Not Found");
      }
    }

    btn.addEventListener("click", doSearch);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
  }

  // ======== 履歴クリア ========

  function setupClearHistory() {
    const btn = document.getElementById("clear-btn");
    btn.addEventListener("click", () => {
      const ok = window.confirm("履歴をクリアします。最新の1件のみ残します。よろしいですか？");
      if (!ok) return;

      if (recordsGlobal.length > 0) {
        recordsGlobal = [ recordsGlobal[0] ];
        saveHistoryLines(recordsGlobal.map(toCsvLine)); // ★ CSV文字列で保存
      } else {
        recordsGlobal = [];
        saveHistoryLines([]);
      }

      renderHistory(recordsGlobal, { skipFirst: false });
      showModal("履歴をクリアしました。", "情報");
    });
  }

  // ======== データ取得＆初期化 ========

  /** APIレスポンスを「行（文字列）」配列に正規化 */
  function normalizeToLines(data) {
    let lines = [];
    if (Array.isArray(data)) {
      lines = data.filter(Boolean);
    } else if (data && typeof data === "object") {
      if (typeof data.text === "string") lines = data.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      else if (Array.isArray(data.items)) lines = data.items.filter(Boolean);
      else if (Array.isArray(data.records)) lines = data.records.filter(Boolean);
      else if (Array.isArray(data.messages)) lines = data.messages.filter(Boolean);
    } else if (typeof data === "string") {
      lines = data.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }
    return lines;
  }

  async function init() {
    const mainLoading = document.getElementById("main-loading");
    const historyLoading = document.getElementById("history-loading");

    let fetchedLines = [];
    let useLines = [];

    try {
      const res = await fetch(API_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      fetchedLines = normalizeToLines(data);

      if (fetchedLines.length === 0) {
        useLines = loadHistoryLines();
      } else if (fetchedLines.length === 1) {
        const current = String(fetchedLines[0]);
        const stored = loadHistoryLines(); // 常にCSV文字列化されて返る
        if (stored[0] !== current) {
          const deduped = [current, ...stored.filter(l => l !== current)];
          useLines = deduped.slice(0, 100);
        } else {
          useLines = stored.length ? stored : [current];
        }
        saveHistoryLines(useLines); // 保存は常にCSV文字列
      } else {
        useLines = fetchedLines.slice(0, 100).map(String);
        saveHistoryLines(useLines);
      }
    } catch (err) {
      console.error(err);
      useLines = loadHistoryLines();
      if (!useLines.length) {
        if (mainLoading) mainLoading.outerHTML = `<td colspan="5" class="error">エラー：${escapeHtml(String(err))}</td>`;
        if (historyLoading) historyLoading.outerHTML = `<td colspan="6">履歴はありません</td>`;
        setupSearch([]); setupClearHistory();
        return;
      }
    }

    // ここからは「配列の配列（records）」で扱う
    recordsGlobal = toRecords(useLines);

    // 最新
    if (mainLoading) mainLoading.parentElement?.remove();
    renderMain(recordsGlobal[0]);

    // 履歴（最新も含めて表示）
    if (historyLoading) historyLoading.parentElement?.remove();
    renderHistory(recordsGlobal, { skipFirst: false });

    // 検索/クリアのセットアップ
    setupSearch(recordsGlobal);
    setupClearHistory();
  }

  // モーダルOK & 外側クリックで閉じる
  document.getElementById("modal-ok").addEventListener("click", hideModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") hideModal();
  });

  // 起動
  init();
</script>
</body>
</html>
