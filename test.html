
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AWS 最新メッセージ</title>
</head>
<body>
<h2>ヒラオキ⇔ミエテル</h2>
<p id="msg">読み込み中...</p>

<script>
const url = "https://5kptpm020d.execute-api.ap-northeast-1.amazonaws.com/message";

fetch(url)
  .then(res => res.json())
  .then(data => {
    document.getElementById("msg").innerText = data.text;
  })
  .catch(err => {
    document.getElementById("msg").innerText = "エラー: " + err;
  });
</script>
</body>
</html>
